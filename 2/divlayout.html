<!DOCTYPE html>
<html>
<head>
    <title>University Information</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: auto;
        }

        .header {
            background: navy;
            color: white;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 20px;
            margin: 15px;
            border-radius: 10px;
        }

        .item {
            display: inline-block;
            background: lightblue;
            padding: 20px;
            margin: 10px;
            width: 150px;
        }

        span {
            color: blue;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>University Information Portal</h1>
        <p>Welcome to our university</p>
    </div>

    <div class="box">
        <h2>University Facilities</h2>

        <div class="item">
            <h3>Library</h3>
            <span>Digital Books</span>
        </div>

        <div class="item">
            <h3>Computer Lab</h3>
            <span>Modern Systems</span>
        </div>

        <div class="item">
            <h3>Sports</h3>
            <span>Sports Ground</span>
        </div>
    </div>

    <div class="box">
        <h2>University Audio</h2>

        <audio controls>
            <source src="audio.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div class="box">
        <h2>University Video</h2>

        <video width="400" controls>
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>

    <div class="box">
        <h2>About University</h2>
        <p>
            Our university provides
            <span>quality education</span>
            and modern infrastructure.
        </p>
    </div>

</div>

</body>
</html>
