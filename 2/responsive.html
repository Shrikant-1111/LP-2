<!DOCTYPE html>
<html>
<head>
    <title>Responsive University Website</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            background: navy;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background: #333;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .container {
            display: flex;
            padding: 20px;
            gap: 20px;
        }

        .content {
            flex: 3;
            background: lightblue;
            padding: 20px;
        }

        .sidebar {
            flex: 1;
            background: lightgray;
            padding: 20px;
        }

        footer {
            background: navy;
            color: white;
            text-align: center;
            padding: 15px;
        }

        @media(max-width: 600px) {
            .container {
                flex-direction: column;
            }

            nav a {
                display: block;
                margin: 10px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>KK Wagh University</h1>
    <p>Welcome to Information Technology Department</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Courses</a>
    <a href="#">Contact</a>
</nav>

<div class="container">

    <div class="content">
        <h2>Main Content</h2>
        <p>
            Our university provides quality education,
            modern laboratories and excellent facilities.
        </p>
    </div>

    <div class="sidebar">
        <h2>Sidebar</h2>
        <p>Latest News</p>
        <p>Upcoming Events</p>
        <p>Notifications</p>
    </div>

</div>

<footer>
    <p>Copyright 2026 KK Wagh University</p>
</footer>

</body>
</html>
