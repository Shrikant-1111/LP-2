
<!DOCTYPE html>
<html>
<head>
    <title>Interactive Registration Form</title>

    <style>
        body {
            font-family: Arial;
            background: white;
            color: black;
            padding: 20px;
        }

        .dark {
            background: #222;
            color: white;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 8px;
            margin: 5px;
            cursor: pointer;
        }

        .error {
            color: red;
            font-size: 14px;
        }
    </style>
</head>

<body>

<h2>Student Registration Form</h2>

<form id="regForm">

    Name:
    <input type="text" id="name" placeholder="Enter name">
    <span class="error" id="nameError"></span>
    <br>

    Email:
    <input type="text" id="email" placeholder="Enter email">
    <span class="error" id="emailError"></span>
    <br>

    Password:
    <input type="password" id="password" placeholder="Enter password">
    <span class="error" id="passError"></span>
    <br>

    Age:
    <input type="number" id="age" placeholder="Enter age">
    <span class="error" id="ageError"></span>
    <br>

    Phone:
    <input type="text" id="phone" placeholder="10 digit phone">
    <span class="error" id="phoneError"></span>
    <br>

    <button type="submit">Register</button>

</form>

<p id="result"></p>

<hr>

<h3>DOM Manipulation</h3>

<button onclick="changeText()">Change Content</button>
<button onclick="changeTheme()">Change Theme</button>
<button onclick="toggleSection()">Show/Hide</button>
<button onclick="formatText()">Format Text</button>

<p id="content">Welcome to JavaScript DOM Manipulation!</p>

<div id="section">
    <p>This is a hidden section.</p>
</div>

<hr>

<h3>Countdown Timer</h3>

<h2 id="timer">10</h2>
<button onclick="startTimer()">Start Timer</button>

<script>

// (a) FORM VALIDATION

document.getElementById("regForm").addEventListener("submit",
function(event) {

    event.preventDefault();

    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value;
    let age = Number(document.getElementById("age").value);
    let phone = document.getElementById("phone").value.trim();

    let valid = true;

    // Clear old errors
    document.querySelectorAll(".error").forEach(e => e.innerHTML = "");

    if (name.length < 3) {
        document.getElementById("nameError").innerHTML =
        "Name must contain at least 3 characters";
        valid = false;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById("emailError").innerHTML =
        "Enter a valid email";
        valid = false;
    }

    if (password.length < 6) {
        document.getElementById("passError").innerHTML =
        "Password must be at least 6 characters";
        valid = false;
    }

    if (!Number.isInteger(age) || age < 18 || age > 100) {
        document.getElementById("ageError").innerHTML =
        "Age must be between 18 and 100";
        valid = false;
    }

    if (!/^[0-9]{10}$/.test(phone)) {
        document.getElementById("phoneError").innerHTML =
        "Enter a valid 10 digit phone number";
        valid = false;
    }

    if (valid) {
        document.getElementById("result").innerHTML =
        "Registration Successful!";
        alert("Form Submitted Successfully!");
    }
});


// (b) DOM MANIPULATION

// Change content
function changeText() {
    document.getElementById("content").innerHTML =
    "Content Updated Successfully!";
}

// Theme switching
function changeTheme() {
    document.body.classList.toggle("dark");
}

// Show/Hide section
function toggleSection() {
    let section = document.getElementById("section");

    if (section.style.display === "none") {
        section.style.display = "block";
    } else {
        section.style.display = "none";
    }
}

// Text formatting
function formatText() {
    let text = document.getElementById("content");

    text.style.color = "blue";
    text.style.fontSize = "25px";
    text.style.fontWeight = "bold";
}


// Countdown timer
let count = 10;
let timerId;

function startTimer() {

    if (timerId) return;

    timerId = setInterval(function() {

        if (count > 0) {
            count--;
            document.getElementById("timer").innerHTML = count;
        } else {
            clearInterval(timerId);
            timerId = null;
            alert("Time's Up!");
        }

    }, 1000);
}


// (c) REAL-TIME EVENTS

document.getElementById("name").addEventListener("input", function() {

    if (this.value.trim().length >= 3) {
        document.getElementById("nameError").innerHTML = "";
    } else {
        document.getElementById("nameError").innerHTML =
        "Name must contain at least 3 characters";
    }

});

document.getElementById("email").addEventListener("input", function() {

    if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.value.trim())) {
        document.getElementById("emailError").innerHTML = "";
    } else {
        document.getElementById("emailError").innerHTML =
        "Please enter a valid email";
    }

});

</script>

</body>
</html>
